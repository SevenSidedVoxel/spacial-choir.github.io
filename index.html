<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Gyroscope HRTF Spatializer</title>
	<style>
		body {
			font-family: system-ui, sans-serif;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			height: 100vh;
			margin: 0;
			background: #121212;
			color: #ffffff;
		}

		button {
			padding: 15px 30px;
			font-size: 1.2rem;
			font-weight: bold;
			color: white;
			background: #007bff;
			border: none;
			border-radius: 8px;
			cursor: pointer;
			transition: background 0.2s;
		}

		button:hover {
			background: #0056b3;
		}

		#status {
			margin-top: 20px;
			color: #aaa;
			text-align: center;
		}
	</style>
</head>

<body>

	<button id="startButton">Enable Tracking & Start</button>
	<div id="status">Put on headphones and click the button above.</div>

	<canvas id="graphicCanvas" width="300" height="300"></canvas>

	<label for="volSlider">Volume: <span id="volValue">-20</span> dB</label><br>
	<input type="range" id="volSlider" min="-80" max="0" value="-20">

	<label for="angleSlider">Facing: <span id="angleValue">0</span>°</label><br>
	<input type="range" id="angleSlider" min="-360" max="360" value="0">

	<footer style="margin-top: 30px; color: #303030;">Version: angle linked</footer>

	<script>
		// Constants
		const Rad2Deg = 180 / Math.PI;
		const Deg2Rad = Math.PI / 180;

		// Audio
		let audioCtx;
		let masterGain;

		// Graphics
		let canvas;
		let ctx;

		// App Data
		let facingRad = 0;
		let listenRad = 80 * Deg2Rad;
		let sources = [];

		const startButton = document.getElementById('startButton');
		const statusDiv = document.getElementById('status');
		startButton.addEventListener('click', async () => {
			// 1. Initialize Audio
			if (!audioCtx) {
				initAudio();
			}

			// 2. Request Gyroscope Permissions
			if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
				try {
					const permissionState = await DeviceOrientationEvent.requestPermission();
					if (permissionState === 'granted') {
						startTracking();
					} else {
						statusDiv.innerText = "Permission to access sensors was denied.";
					}
				} catch (error) {
					console.error(error);
					statusDiv.innerText = "Error requesting sensor permissions.";
				}
			} else {
				// Fallback for browsers that don't require explicit permissions (most Android/Desktops)
				startTracking();
			}

			function startTracking() {
				window.addEventListener('deviceorientation', handleOrientation);
				statusDiv.innerText = "Tracking active! Spin your chair.";
				startButton.style.display = 'none';
			}

			// 3. Setup Graphics
			if (!ctx) {
				canvas = document.getElementById('graphicCanvas');
				ctx = canvas.getContext('2d');
				canvas.style.display = 'show';
				requestAnimationFrame(loop);
			}
		});

		function initAudio() {
			audioCtx = new (window.AudioContext || window.webkitAudioContext)();

			masterGain = audioCtx.createGain();
			masterGain.gain.value = 0.01;
			masterGain.connect(audioCtx.destination);

			addSource(220, +1, 0, '#3498DB');
			addSource(320, -1, 0, '#BF922A');

			function addSource(freq, x, y, color) {
				// Create Source Wave
				let oscillator = audioCtx.createOscillator();
				oscillator.type = 'sawtooth';
				oscillator.frequency.setValueAtTime(freq, audioCtx.currentTime);

				// Create Volume Gain
				let gain = audioCtx.createGain();
				gain.gain.value = 1;

				// Create Filter
				let filter = audioCtx.createBiquadFilter();
				filter.type = 'lowpass';
				filter.frequency.setValueAtTime(800, audioCtx.currentTime);

				// Create HRTF Panner
				let panner = audioCtx.createPanner();
				panner.panningModel = 'HRTF';
				panner.distanceModel = 'inverse';

				// Set Position
				panner.positionX.setValueAtTime(x, audioCtx.currentTime);
				panner.positionY.setValueAtTime(0, audioCtx.currentTime);
				panner.positionZ.setValueAtTime(-y, audioCtx.currentTime);

				// Chain Nodes
				oscillator.connect(gain);
				gain.connect(filter);
				filter.connect(panner);
				panner.connect(masterGain);

				oscillator.start();

				sources.push({ pan: panner, osc: oscillator, gain: gain, filt: filter, color: color });
			}
		}

		function updateListenDir(x, y, z) {
			if (audioCtx.listener.forwardX) {
				// Modern Web Audio API standard
				audioCtx.listener.forwardX.setValueAtTime(x, audioCtx.currentTime);
				audioCtx.listener.forwardY.setValueAtTime(y, audioCtx.currentTime);
				audioCtx.listener.forwardZ.setValueAtTime(z, audioCtx.currentTime);
			} else {
				// Deprecated fallback for older browsers
				audioCtx.listener.setOrientation(x, y, z, 0, 1, 0);
			}
		}

		function handleOrientation(event) {
			if (!audioCtx) return;

			// alpha: rotation around z-axis (0 to 360 degrees) - compass direction
			// beta: rotation around x-axis (-180 to 180 degrees) - front-to-back tilt
			// gamma: rotation around y-axis (-90 to 90 degrees) - left-to-right tilt
			const alpha = event.alpha ? event.alpha * (Math.PI / 180) : 0;
			const beta = event.beta ? event.beta * (Math.PI / 180) : 0;
			const gamma = event.gamma ? event.gamma * (Math.PI / 180) : 0;
			updateListenAngle(alpha);
		}

		function loop() {
			update();
			draw();

			// Queue next frame
			requestAnimationFrame(loop);
		}

		const baseOrientation = -Math.PI / 2;
		function update() {
			statusDiv.innerText = '';

			// Apply Source Orientation Deafening
			var rad = baseOrientation + facingRad;
			const dirX = Math.cos(rad);
			const dirY = Math.sin(rad);
			sources.forEach(src => {
				const x = src.pan.positionX.value;
				const y = src.pan.positionZ.value;
				if (x == 0 && y == 0) {
					// source is at origin, always playing
					src.gain.gain.setValueAtTime(1, audioCtx.currentTime);
					return;
				}

				// Normalize direction
				const l = 1.0 / Math.hypot(x, y);
				const nx = x * l;
				const ny = y * l;

				// Dot for angle & degrees away from listen dir
				const dot = nx * dirX + ny * dirY;
				const maxDot = Math.cos(listenRad * 0.25);
				const t = Math.min(1, Math.max(0, dot) / maxDot); // 0 == exactly facingRad, 1 == at least listenRad of difference
				const s = 1 - t;

				src.gain.gain.setValueAtTime(t, audioCtx.currentTime);
			});
		}

		function draw() {
			update();

			const cx = canvas.width / 2;
			const cy = canvas.height / 2;
			const scale = 100;

			ctx.fillStyle = '#2c3e50';
			ctx.clearRect(0, 0, canvas.width, canvas.height);

			// Draw Listening Slice
			const N = sources.length;
			const sliceAngle = (2 * Math.PI) / N;
			{
				const startAngle = baseOrientation + facingRad - 0.5 * listenRad;
				const endAngle = startAngle + listenRad;

				ctx.beginPath();
				ctx.moveTo(cx, cy);
				ctx.arc(cx, cy, 100, startAngle, endAngle);
				ctx.closePath();

				ctx.fillStyle = '#e0e0e0';
				ctx.fill();
				ctx.strokeStyle = '#ccc';
				ctx.stroke();
			}

			// Draw Sources
			sources.forEach(src => {
				const x = cx + (src.pan.positionX.value * scale);
				const y = cy + (src.pan.positionZ.value * scale);
				const vol = src.gain.gain.value;

				// Volume
				ctx.beginPath();
				ctx.arc(x, y, 6 + 12 * vol, 0, 2 * Math.PI);
				ctx.fillStyle = lightenHex(src.color, 0.1);
				ctx.fill();

				// Position
				ctx.beginPath();
				ctx.arc(x, y, 6, 0, 2 * Math.PI);
				ctx.fillStyle = src.color;
				ctx.fill();
				ctx.lineWidth = 2;
				ctx.strokeStyle = '#fff';
				ctx.stroke();
			});
		}

		// Volume
		const volSlider = document.getElementById('volSlider');
		const volValue = document.getElementById('volValue');
		volSlider.addEventListener('input', (e) => {
			if (!masterGain) return;
			let volDB = parseFloat(e.target.value);
			let volLin = dbToLin(volDB);
			masterGain.gain.setValueAtTime(volLin, audioCtx.currentTime);
			volValue.textContent = volDB;
		});

		// Sliders
		const angleSlider = document.getElementById('angleSlider');
		const angleValue = document.getElementById('angleValue');
		angleSlider.addEventListener('input', (e) => {
			let facingDeg = parseInt(e.target.value);
			updateListenAngle(facingDeg * Deg2Rad);
		});
		function updateListenAngle(angleRad) {
			angleValue.textContent = Math.round(angleRad * Rad2Deg);

			facingRad = angleRad;
			const x = Math.sin(facingRad);
			const y = 0;
			const z = -Math.cos(facingRad);
			updateListenDir(x, y, z);
		}

		function dbToLin(db) {
			if (db <= -80)
				return 0;
			return Math.pow(10, db / 10.0);
		}

		function lightenHex(hex, percent) {
			// Remove '#' if present
			hex = hex.replace(/^#/, '');

			// Parse RGB values
			let r = parseInt(hex.substring(0, 2), 16);
			let g = parseInt(hex.substring(2, 4), 16);
			let b = parseInt(hex.substring(4, 6), 16);

			// Lighten each channel
			r = Math.min(255, Math.floor(r + (255 - r) * percent));
			g = Math.min(255, Math.floor(g + (255 - g) * percent));
			b = Math.min(255, Math.floor(b + (255 - b) * percent));

			// Convert back to hex
			return `#${((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1)}`;
		}
	</script>
</body>

</html>
